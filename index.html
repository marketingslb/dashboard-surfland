<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Surfland</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      margin-bottom: 40px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .kpi-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }

    .kpi-label {
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 600;
      color: #22d3ee;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 20px;
    }

    .chart-container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
    }

    .chart-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    canvas {
      max-height: 300px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }

    .error {
      background: #7f1d1d;
      border: 1px solid #dc2626;
      color: #fca5a5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .last-update {
      text-align: right;
      color: #64748b;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 Dashboard Surfland</h1>
      <p class="subtitle">Integração Spotter + Meta + Sheets</p>
    </header>

    <div id="error-container"></div>

    <div id="loading" class="loading">
      <p>Carregando dados...</p>
    </div>

    <div id="content" style="display: none;">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-label">Total de Leads</div>
          <div class="kpi-value" id="total-leads">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Leads Hoje</div>
          <div class="kpi-value" id="leads-today">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Taxa de Conversão</div>
          <div class="kpi-value" id="conversion-rate">0%</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">CAC Médio</div>
          <div class="kpi-value" id="avg-cac">R$ 0</div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-container">
          <div class="chart-title">📈 Leads por Data</div>
          <canvas id="leadsChart"></canvas>
        </div>

        <div class="chart-container">
          <div class="chart-title">🎯 Leads por Fonte</div>
          <canvas id="sourceChart"></canvas>
        </div>

        <div class="chart-container">
          <div class="chart-title">🔄 Funil de Conversão</div>
          <canvas id="funnelChart"></canvas>
        </div>
      </div>

      <div class="last-update">
        <p>Última atualização: <span id="timestamp">--</span></p>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = '/api/leads';

    let leadsChart, sourceChart, funnelChart;

    async function fetchData() {
      try {
        console.log('🔄 Buscando dados...');

        const response = await fetch(BACKEND_URL);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        console.log('✅ Dados:', data);

        if (data.status === 'ok') {
          updateDashboard(data);
        } else {
          showError('Erro: ' + (data.error || 'Desconhecido'));
        }
      } catch (error) {
        console.error('❌ Erro:', error);
        showError('Erro ao conectar: ' + error.message);
      }
    }

    function showError(message) {
      document.getElementById('error-container').innerHTML = `<div class="error">⚠️ ${message}</div>`;
    }

    function updateDashboard(data) {
      const leads = data.spotter.Leads || [];

      document.getElementById('total-leads').textContent = leads.length.toLocaleString('pt-BR');

      const today = new Date().toISOString().split('T')[0];
      const leadsToday = leads.filter(l => l.registerDate?.startsWith(today)).length;
      document.getElementById('leads-today').textContent = leadsToday;

      const conversionRate = leads.length > 0 ? Math.round((leadsToday / leads.length) * 100) : 0;
      document.getElementById('conversion-rate').textContent = conversionRate + '%';

      document.getElementById('avg-cac').textContent = 'R$ 0';

      // Timeline
      const leadsByDate = {};
      leads.forEach(lead => {
        const date = lead.registerDate?.split('T')[0] || 'N/A';
        leadsByDate[date] = (leadsByDate[date] || 0) + 1;
      });

      const sortedDates = Object.keys(leadsByDate).sort().slice(-30);
      const timelineData = sortedDates.map(date => leadsByDate[date]);

      renderChart('leadsChart', {
        type: 'line',
        labels: sortedDates,
        datasets: [{
          label: 'Leads',
          data: timelineData,
          borderColor: '#22d3ee',
          backgroundColor: 'rgba(34, 211, 238, 0.1)',
          fill: true,
          tension: 0.4
        }]
      });

      // Por Fonte
      const leadsBySource = {};
      leads.forEach(lead => {
        const source = lead.source || 'Desconhecido';
        leadsBySource[source] = (leadsBySource[source] || 0) + 1;
      });

      const sources = Object.keys(leadsBySource).slice(0, 8);
      const sourceCounts = sources.map(s => leadsBySource[s]);
      const colors = ['#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#06b6d4', '#f97316', '#84cc16'];

      renderChart('sourceChart', {
        type: 'doughnut',
        labels: sources,
        datasets: [{
          data: sourceCounts,
          backgroundColor: colors.slice(0, sources.length)
        }]
      });

      // Funil
      const funnelStages = ['Leads Total', 'Contatos', 'Oportunidades', 'Clientes'];
      const funnelData = [
        leads.length,
        Math.round(leads.length * 0.7),
        Math.round(leads.length * 0.4),
        Math.round(leads.length * 0.15)
      ];

      renderChart('funnelChart', {
        type: 'bar',
        labels: funnelStages,
        datasets: [{
          label: 'Conversão',
          data: funnelData,
          backgroundColor: '#22d3ee'
        }]
      });

      document.getElementById('timestamp').textContent = new Date(data.timestamp).toLocaleString('pt-BR');
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    }

    function renderChart(canvasId, config) {
      const ctx = document.getElementById(canvasId).getContext('2d');

      if (window[canvasId]) {
        window[canvasId].destroy();
      }

      window[canvasId] = new Chart(ctx, {
        type: config.type,
        data: {
          labels: config.labels,
          datasets: config.datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: {
              labels: { color: '#94a3b8' }
            }
          },
          scales: {
            y: {
              ticks: { color: '#64748b' },
              grid: { color: '#334155' }
            },
            x: {
              ticks: { color: '#64748b' },
              grid: { color: '#334155' }
            }
          }
        }
      });
    }

    fetchData();
    setInterval(fetchData, 60000);
  </script>
</body>
</html>
